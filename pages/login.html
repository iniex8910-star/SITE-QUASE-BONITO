<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/login.css">
    <title>login-E-bar</title>
</head>

<body>
    <div class="container_login">
        <h2>Log-in</h2>
        <form class="login_form" id="login_form">
            <div class="div_info">
                <label for="nome_fild">Nome:</label>
                <input type="text" id="nome_fild" name="nome" placeholder="Digite seu nome aqui..." required>
            </div>
            <div class="div_info">
                <label for="email_fild">Email:</label>
                <input type="email" id="email_fild" name="email" placeholder="Digite seu email aqui..." required>
            </div>
            <div class="div_info">
                <label for="senha_fild">Senha:</label>
                <input type="password" id="senha_fild" name="senha" placeholder="Digite sua senha aqui..." required>
            </div>
           
            <button id="btn_submit" type="submit">Entrar</button>
           
        </form>
        <a href="cadastro.html">Crie uma conta</a>
    </div>
    <script>
        const loginForm = document.getElementById('login_form');

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();

            if (!loginForm.checkValidity()) {
                loginForm.reportValidity();
                return;
            }

            window.location.href = '../index.html';
        });
    </script>
</body>

</html>
