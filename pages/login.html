<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/login.css">
    <title>login-E-bar</title>
</head>

<body>
    <div class="container_login">
        <h2>Log-in</h2>
        <form class="login_form" id="login_form" action="">
            <div class="div_info">
                <label for="nome">Nome:</label>
                <input type="text" id="nome_fild" name="nome" placeholder="Digite seu nome aqui...">
            </div>
            <div class="div_info">
                <label for="email">Email:</label>
                <input type="email" id="email_fild" name="email" placeholder="Digite seu email aqui...">
            </div>
            <div class="div_info">
                <label for="email">Senha:</label>
                <input type="senha" id="senha_fild" name="senha" placeholder="Digite sua senha aqui...">
            </div>
           
            <button id="btn_submit" type="submit" onclick="window.location.href='../index.html'">Entrar</button>
           
        </form>
        <a href="/">Crie uma conta</a>
    </div>
</body>

</html>
